[project]
name = "ytsorter"
version = "0.1.0"
description = "Sort YouTube Music liked songs into playlists using the Claude CLI"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "ytmusicapi",
    "platformdirs",
]

[project.scripts]
ytsorter = "ytsorter.__main__:main"

[dependency-groups]
dev = [
    "pytest",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ytsorter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
